name: SOVEREIGN Android verification

on:
  push:
    branches: [main]
    paths:
      - "components/sovereign-os/**"
      - ".github/workflows/sovereign-android.yml"
  pull_request:
    branches: [main]
    paths:
      - "components/sovereign-os/**"
      - ".github/workflows/sovereign-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: components/sovereign-os
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Inspect Android 17 beta SDK packages
        run: |
          sdkmanager --list --channel=1 | grep -E 'platforms;android-37|build-tools;37' || true
      - name: Install Android 17 preview SDK and Build Tools 37
        run: sdkmanager --channel=1 "platforms;android-37.0" "build-tools;37.0.0"
      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.4.1"
      - name: Verify dependency resolution
        run: gradle --no-daemon dependencies --configuration debugRuntimeClasspath
      - name: Run unit tests
        run: gradle --no-daemon test
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload verification outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sovereign-android-verification
          path: |
            components/sovereign-os/app/build/outputs/apk/debug/*.apk
            components/sovereign-os/app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14
